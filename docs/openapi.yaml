openapi: 3.0.3
info:
  title: HR SaaS API
  description: |
    Multi-tenant HR platform API. All business routes are versioned under `/api/v1`.

    **Auth model:** JWT access token (15 min, Bearer header) + refresh token (7 days, httpOnly cookie on `/api/v1/auth`).

    **Roles:** `super_admin`, `company_admin`, `hr_manager`, `manager`, `employee`
  version: 0.0.1

servers:
  - url: http://localhost:5000
    description: Local development
  - url: https://{vercelProject}.vercel.app
    description: Vercel deployment
    variables:
      vercelProject:
        default: your-server-project

tags:
  - name: Health
    description: Service health checks
  - name: Auth
    description: Company registration, login, session refresh
  - name: Admin
    description: Platform admin user management and company registration approval

paths:
  /:
    get:
      tags: [Health]
      summary: Root
      description: Confirms the server is running.
      operationId: getRoot
      responses:
        '200':
          description: Plain text confirmation
          content:
            text/plain:
              schema:
                type: string
                example: Server is running

  /api/v1/health:
    get:
      tags: [Health]
      summary: Health check
      description: Returns service status and timestamp.
      operationId: getHealth
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'

  /api/v1/auth/register:
    post:
      tags: [Auth]
      summary: Register company
      description: |
        Submits a new company registration for super admin approval.
        Creates a pending tenant and inactive `company_admin` user.
        Does **not** return tokens — the company admin can sign in only after approval.
      operationId: registerCompany
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
            example:
              companyName: Acme Ltd
              email: admin@acme.com
              password: TestPass123
              firstName: Jane
              lastName: Admin
      responses:
        '201':
          description: Registration submitted — pending approval
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterPendingResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          description: Email already in use
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/auth/login:
    post:
      tags: [Auth]
      summary: Login
      description: |
        Authenticates with email and password.
        Returns an access token and sets a refresh httpOnly cookie.
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              email: admin@acme.com
              password: TestPass123
      responses:
        '200':
          description: Login successful
          headers:
            Set-Cookie:
              description: Refresh token cookie (`refreshToken`)
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSuccessResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: Invalid email or password
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Company pending approval, rejected, or inactive
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/auth/refresh:
    post:
      tags: [Auth]
      summary: Refresh access token
      description: |
        Exchanges the refresh httpOnly cookie for a new access token.
        Cookie path must be `/api/v1/auth`.
      operationId: refreshToken
      responses:
        '200':
          description: New access token issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSuccessResponse'
        '401':
          description: Missing or invalid refresh token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/auth/logout:
    post:
      tags: [Auth]
      summary: Logout
      description: Clears the refresh token cookie.
      operationId: logout
      responses:
        '200':
          description: Logged out
          content:
            application/json:
              schema:
                type: object
                required: [status, data]
                properties:
                  status:
                    type: string
                    enum: [ok]
                  data:
                    type: object
                    properties:
                      message:
                        type: string
                        example: Logged out

  /api/v1/auth/me:
    get:
      tags: [Auth]
      summary: Current user
      description: Returns the authenticated user from the Bearer access token.
      operationId: getCurrentUser
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Current user profile
          content:
            application/json:
              schema:
                type: object
                required: [status, data]
                properties:
                  status:
                    type: string
                    enum: [ok]
                  data:
                    type: object
                    required: [user]
                    properties:
                      user:
                        $ref: '#/components/schemas/UserProfile'
        '401':
          $ref: '#/components/responses/Unauthorized'

    patch:
      tags: [Auth]
      summary: Update current user profile
      description: |
        Update the authenticated user's profile (name, email, password).
        Returns a new access token when the email is changed.
      operationId: updateCurrentUser
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProfileRequest'
            example:
              firstName: Jane
              lastName: Admin
              email: admin@acme.com
      responses:
        '200':
          description: Profile updated
          content:
            application/json:
              schema:
                type: object
                required: [status, data]
                properties:
                  status:
                    type: string
                    enum: [ok]
                  data:
                    $ref: '#/components/schemas/UpdateProfileResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: Email already in use
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/admins:
    post:
      tags: [Admin]
      summary: Create admin user
      description: |
        Creates a platform or tenant admin user.

        **Bootstrap:** When the database has zero users, unauthenticated requests may create the first `super_admin`.

        **Otherwise:** Requires Bearer token with `super_admin` role.
      operationId: createAdmin
      security:
        - bearerAuth: []
        - {}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAdminRequest'
            example:
              email: superadmin@hr.com
              password: User@123
              role: super_admin
              firstName: Super
              lastName: Admin
      responses:
        '201':
          description: Admin user created
          content:
            application/json:
              schema:
                type: object
                required: [status, data]
                properties:
                  status:
                    type: string
                    enum: [ok]
                  data:
                    $ref: '#/components/schemas/AdminUser'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: Email already in use
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/admin/registrations:
    get:
      tags: [Admin]
      summary: List company registrations
      description: Lists company registration requests. Defaults to non-approved when `status` is omitted.
      operationId: listRegistrations
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, approved, rejected]
      responses:
        '200':
          description: Registration list
          content:
            application/json:
              schema:
                type: object
                required: [status, data]
                properties:
                  status:
                    type: string
                    enum: [ok]
                  data:
                    type: object
                    required: [registrations]
                    properties:
                      registrations:
                        type: array
                        items:
                          $ref: '#/components/schemas/RegistrationRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/admin/registrations/{tenantId}/approve:
    post:
      tags: [Admin]
      summary: Approve company registration
      description: Activates the tenant and company admin user.
      operationId: approveRegistration
      security:
        - bearerAuth: []
      parameters:
        - name: tenantId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Registration approved
          content:
            application/json:
              schema:
                type: object
                required: [status, data]
                properties:
                  status:
                    type: string
                    enum: [ok]
                  data:
                    $ref: '#/components/schemas/RegistrationRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Registration not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Registration already processed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/admin/registrations/{tenantId}/reject:
    post:
      tags: [Admin]
      summary: Reject company registration
      operationId: rejectRegistration
      security:
        - bearerAuth: []
      parameters:
        - name: tenantId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
                  maxLength: 500
      responses:
        '200':
          description: Registration rejected
          content:
            application/json:
              schema:
                type: object
                required: [status, data]
                properties:
                  status:
                    type: string
                    enum: [ok]
                  data:
                    $ref: '#/components/schemas/RegistrationRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Registration not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Registration already processed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Short-lived access token from login

  responses:
    BadRequest:
      description: Validation error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Authentication required or token invalid
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: Insufficient permissions
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:
    UserRole:
      type: string
      enum:
        - super_admin
        - company_admin
        - hr_manager
        - manager
        - employee

    HealthResponse:
      type: object
      required: [status, service, timestamp]
      properties:
        status:
          type: string
          enum: [ok]
        service:
          type: string
          example: HR SaaS
        timestamp:
          type: string
          format: date-time

    ErrorResponse:
      type: object
      required: [status, message]
      properties:
        status:
          type: string
          enum: [error]
        message:
          type: string

    AuthUser:
      type: object
      required: [id, email, role]
      properties:
        id:
          type: string
          example: 507f1f77bcf86cd799439011
        email:
          type: string
          format: email
        role:
          $ref: '#/components/schemas/UserRole'
        tenantId:
          type: string
          description: Omitted for super_admin
        firstName:
          type: string
        lastName:
          type: string

    UserProfile:
      allOf:
        - $ref: '#/components/schemas/AuthUser'
        - type: object
          required: [isActive, createdAt, updatedAt]
          properties:
            companyName:
              type: string
              description: Company name for tenant users
            isActive:
              type: boolean
            createdAt:
              type: string
              format: date-time
            updatedAt:
              type: string
              format: date-time

    UpdateProfileRequest:
      type: object
      properties:
        firstName:
          type: string
          maxLength: 100
        lastName:
          type: string
          maxLength: 100
        email:
          type: string
          format: email
        currentPassword:
          type: string
        newPassword:
          type: string
          minLength: 8

    UpdateProfileResponse:
      type: object
      required: [user]
      properties:
        user:
          $ref: '#/components/schemas/UserProfile'
        accessToken:
          type: string
          description: New JWT when email changed

    AdminUser:
      allOf:
        - $ref: '#/components/schemas/AuthUser'
        - type: object
          required: [isActive, createdAt]
          properties:
            isActive:
              type: boolean
            createdAt:
              type: string
              format: date-time

    RegisterRequest:
      type: object
      required: [companyName, email, password]
      properties:
        companyName:
          type: string
          minLength: 2
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
        firstName:
          type: string
        lastName:
          type: string

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string

    CreateAdminRequest:
      type: object
      required: [email, password, role]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
        role:
          $ref: '#/components/schemas/UserRole'
        firstName:
          type: string
        lastName:
          type: string

    RegisterPendingResponse:
      type: object
      required: [status, data]
      properties:
        status:
          type: string
          enum: [ok]
        data:
          type: object
          required: [tenantId, companyName, email, status, message]
          properties:
            tenantId:
              type: string
            companyName:
              type: string
            email:
              type: string
              format: email
            status:
              type: string
              enum: [pending]
            message:
              type: string

    RegistrationRequest:
      type: object
      required: [tenantId, companyName, adminEmail, status, submittedAt]
      properties:
        tenantId:
          type: string
        companyName:
          type: string
        adminEmail:
          type: string
          format: email
        adminFirstName:
          type: string
        adminLastName:
          type: string
        status:
          type: string
          enum: [pending, approved, rejected]
        submittedAt:
          type: string
          format: date-time
        rejectedReason:
          type: string

    AuthSuccessResponse:
      type: object
      required: [status, data]
      properties:
        status:
          type: string
          enum: [ok]
        data:
          type: object
          required: [user, accessToken]
          properties:
            user:
              $ref: '#/components/schemas/AuthUser'
            accessToken:
              type: string
              description: JWT access token (15 min)
