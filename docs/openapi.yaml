      description: |
        Company admin only. Updates tenant-level branding overrides.
        Set a field to null or empty string to revert to platform default.
      operationId: patchTenantBranding
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchTenantBrandingRequest'
            example:
              primaryColor: '#059669'
              logoUrl: https://example.com/logo.png
      responses:
        '200':
          description: Effective branding after update
          content:
            application/json:
              schema:
                type: object
                required: [status, data]
                properties:
                  status:
                    type: string
                    enum: [ok]
                  data:
