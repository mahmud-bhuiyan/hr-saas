        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Tenant not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Short-lived access token from login

  responses:
    BadRequest:
      description: Validation error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Authentication required or token invalid
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: Insufficient permissions
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:
    UserRole:
      type: string
      enum:
        - super_admin
        - company_admin
        - hr_manager
        - manager
        - employee

    HealthResponse:
      type: object
      required: [status, service, timestamp]
      properties:
        status:
          type: string
          enum: [ok]
        service:
          type: string
          example: Daily HR
        timestamp:
          type: string
          format: date-time

    ErrorResponse:
      type: object
      required: [status, message]
      properties:
        status:
          type: string
          enum: [error]
        message:
          type: string

    AuthUser:
      type: object
      required: [id, email, role]
      properties:
        id:
          type: string
          example: 507f1f77bcf86cd799439011
        email:
          type: string
          format: email
        role:
          $ref: '#/components/schemas/UserRole'
        tenantId:
          type: string
          description: Omitted for super_admin
        firstName:
          type: string
        lastName:
          type: string

    UserProfile:
      allOf:
        - $ref: '#/components/schemas/AuthUser'
        - type: object
          required: [isActive, createdAt, updatedAt]
          properties:
            companyName:
              type: string
              description: Company name for tenant users
            isActive:
              type: boolean
            createdAt:
              type: string
              format: date-time
            updatedAt:
              type: string
              format: date-time

    UpdateProfileRequest:
      type: object
      properties:
        firstName:
          type: string
          maxLength: 100
        lastName:
          type: string
          maxLength: 100
        email:
          type: string
          format: email
        currentPassword:
          type: string
        newPassword:
          type: string
          minLength: 8

    UpdateProfileResponse:
      type: object
      required: [user]
      properties:
        user:
          $ref: '#/components/schemas/UserProfile'
        accessToken:
          type: string
          description: New JWT when email changed

    AdminUser:
      allOf:
        - $ref: '#/components/schemas/AuthUser'
        - type: object
          required: [isActive, createdAt]
          properties:
            isActive:
              type: boolean
            createdAt:
              type: string
              format: date-time

    RegisterRequest:
      type: object
      required: [companyName, email, password]
      properties:
        companyName:
          type: string
          minLength: 2
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
        firstName:
          type: string
        lastName:
          type: string

    CreateCompanyRequest:
      type: object
      required: [companyName, email, password]
      properties:
        companyName:
          type: string
          minLength: 2
        email:
          type: string
          format: email
          description: Company admin login email
        password:
          type: string
          minLength: 8
          description: Initial password for the company admin
        firstName:
          type: string
        lastName:
          type: string

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string

    CreateAdminRequest:
      type: object
      required: [email, password, role]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
        role:
          $ref: '#/components/schemas/UserRole'
        firstName:
          type: string
        lastName:
          type: string

    RegisterPendingResponse:
      type: object
      required: [status, data]
      properties:
        status:
          type: string
          enum: [ok]
        data:
          type: object
          required: [tenantId, companyName, email, status, message]
          properties:
            tenantId:
              type: string
            companyName:
              type: string
            email:
              type: string
              format: email
            status:
              type: string
              enum: [pending]
            message:
              type: string

    RegistrationRequest:
      type: object
      required: [tenantId, companyName, adminEmail, status, isActive, submittedAt]
      properties:
        tenantId:
          type: string
        companyName:
          type: string
        adminEmail:
          type: string
          format: email
        adminFirstName:
          type: string
        adminLastName:
          type: string
        status:
          type: string
          enum: [pending, approved, rejected]
        isActive:
          type: boolean
        submittedAt:
          type: string
          format: date-time
        rejectedReason:
          type: string
        createdByName:
          type: string
        updatedByName:
          type: string
        updatedAt:
