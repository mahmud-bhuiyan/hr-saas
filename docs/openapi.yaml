openapi: 3.0.3
info:
  title: HR SaaS API
  description: |
    Multi-tenant HR platform API. All business routes are versioned under `/api/v1`.

    **Auth model:** JWT access token (15 min, Bearer header) + refresh token (7 days, httpOnly cookie on `/api/v1/auth`).

    **Roles:** `super_admin`, `company_admin`, `hr_manager`, `manager`, `employee`
  version: 0.0.1

servers:
  - url: http://localhost:5000
    description: Local development
  - url: https://{vercelProject}.vercel.app
    description: Vercel deployment
    variables:
      vercelProject:
        default: your-server-project

tags:
  - name: Health
    description: Service health checks
  - name: Auth
    description: Company registration, login, session refresh
  - name: Admin
    description: Platform admin user management and company registration approval
  - name: Employees
    description: Tenant-scoped employee directory and profiles
  - name: Leave
    description: Leave requests, balances, approval, and team calendar
  - name: Documents
    description: HR document storage with S3 presigned upload and download
  - name: Platform
    description: Platform-wide site branding and configuration
  - name: Settings
    description: Tenant settings including branding overrides

paths:
  /:
    get:
      tags: [Health]
      summary: Root
      description: Confirms the server is running.
      operationId: getRoot
      responses:
        '200':
          description: Plain text confirmation
          content:
            text/plain:
              schema:
                type: string
                example: Server is running

  /api/v1/health:
    get:
      tags: [Health]
      summary: Health check
      description: Returns service status and timestamp.
      operationId: getHealth
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'

  /api/v1/auth/register:
    post:
      tags: [Auth]
      summary: Register company
      description: |
        Submits a new company registration for super admin approval.
        Creates a pending tenant and inactive `company_admin` user.
        Does **not** return tokens — the company admin can sign in only after approval.
      operationId: registerCompany
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
            example:
              companyName: Acme Ltd
              email: admin@acme.com
              password: TestPass123
              firstName: Jane
              lastName: Admin
      responses:
        '201':
          description: Registration submitted — pending approval
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterPendingResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          description: Email already in use
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/auth/login:
    post:
      tags: [Auth]
      summary: Login
      description: |
        Authenticates with email and password.
        Returns an access token and sets a refresh httpOnly cookie.
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              email: admin@acme.com
              password: TestPass123
      responses:
        '200':
          description: Login successful
          headers:
            Set-Cookie:
              description: Refresh token cookie (`refreshToken`)
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSuccessResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: Invalid email or password
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Company pending approval, rejected, or inactive
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/auth/refresh:
    post:
      tags: [Auth]
      summary: Refresh access token
      description: |
        Exchanges the refresh httpOnly cookie for a new access token.
        Cookie path must be `/api/v1/auth`.
      operationId: refreshToken
      responses:
        '200':
          description: New access token issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSuccessResponse'
        '401':
          description: Missing or invalid refresh token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/auth/logout:
    post:
      tags: [Auth]
      summary: Logout
      description: Clears the refresh token cookie.
      operationId: logout
      responses:
        '200':
          description: Logged out
          content:
            application/json:
              schema:
                type: object
                required: [status, data]
                properties:
                  status:
                    type: string
                    enum: [ok]
                  data:
                    type: object
                    properties:
                      message:
                        type: string
                        example: Logged out

  /api/v1/auth/me:
    get:
      tags: [Auth]
      summary: Current user
      description: Returns the authenticated user from the Bearer access token.
      operationId: getCurrentUser
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Current user profile
          content:
            application/json:
              schema:
                type: object
                required: [status, data]
                properties:
                  status:
                    type: string
                    enum: [ok]
                  data:
                    type: object
                    required: [user]
                    properties:
                      user:
                        $ref: '#/components/schemas/UserProfile'
        '401':
          $ref: '#/components/responses/Unauthorized'

    patch:
      tags: [Auth]
      summary: Update current user profile
      description: |
        Update the authenticated user's profile (name, email, password).
        Returns a new access token when the email is changed.
      operationId: updateCurrentUser
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProfileRequest'
            example:
              firstName: Jane
              lastName: Admin
              email: admin@acme.com
      responses:
        '200':
          description: Profile updated
          content:
            application/json:
              schema:
                type: object
                required: [status, data]
                properties:
                  status:
                    type: string
                    enum: [ok]
                  data:
                    $ref: '#/components/schemas/UpdateProfileResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: Email already in use
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/admins:
    post:
      tags: [Admin]
      summary: Create admin user
      description: |
        Creates a platform or tenant admin user.

        **Bootstrap:** When the database has zero users, unauthenticated requests may create the first `super_admin`.

        **Otherwise:** Requires Bearer token with `super_admin` role.
      operationId: createAdmin
      security:
        - bearerAuth: []
        - {}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAdminRequest'
            example:
              email: superadmin@hr.com
              password: User@123
              role: super_admin
              firstName: Super
              lastName: Admin
      responses:
        '201':
          description: Admin user created
          content:
            application/json:
              schema:
                type: object
                required: [status, data]
                properties:
                  status:
                    type: string
                    enum: [ok]
                  data:
                    $ref: '#/components/schemas/AdminUser'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: Email already in use
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/admin/registrations:
    get:
      tags: [Admin]
      summary: List company registrations
      description: Lists company registration requests. Defaults to non-approved when `status` is omitted.
      operationId: listRegistrations
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, approved, rejected]
      responses:
        '200':
          description: Registration list
          content:
            application/json:
              schema:
                type: object
                required: [status, data]
                properties:
                  status:
                    type: string
                    enum: [ok]
                  data:
                    type: object
                    required: [registrations]
                    properties:
                      registrations:
                        type: array
                        items:
                          $ref: '#/components/schemas/RegistrationRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [Admin]
      summary: Create company (super admin)
      description: |
        Creates an approved company and company admin account in one step.
        The admin can sign in immediately — no approval step required.

        Requires `super_admin` role.
      operationId: createCompany
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCompanyRequest'
            example:
              companyName: Acme Ltd
              email: admin@acme.com
              password: TestPass123
              firstName: Jane
              lastName: Admin
      responses:
        '201':
          description: Company created and approved
          content:
            application/json:
              schema:
                type: object
                required: [status, data]
                properties:
                  status:
                    type: string
                    enum: [ok]
                  data:
                    $ref: '#/components/schemas/RegistrationRequest'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: Email already in use
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/admin/registrations/{tenantId}/approve:
    post:
      tags: [Admin]
      summary: Approve company registration
      description: Activates the tenant and company admin user.
      operationId: approveRegistration
      security:
        - bearerAuth: []
      parameters:
        - name: tenantId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Registration approved
          content:
            application/json:
              schema:
                type: object
                required: [status, data]
                properties:
                  status:
                    type: string
                    enum: [ok]
                  data:
                    $ref: '#/components/schemas/RegistrationRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Registration not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Registration already processed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/admin/registrations/{tenantId}/reject:
    post:
      tags: [Admin]
      summary: Reject company registration
      operationId: rejectRegistration
      security:
        - bearerAuth: []
      parameters:
        - name: tenantId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
                  maxLength: 500
      responses:
        '200':
          description: Registration rejected
          content:
            application/json:
              schema:
                type: object
                required: [status, data]
                properties:
                  status:
                    type: string
                    enum: [ok]
                  data:
                    $ref: '#/components/schemas/RegistrationRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Registration not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Registration already processed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/admin/registrations/{tenantId}:
    patch:
      tags: [Admin]
      summary: Update approved company
      description: Updates company name and/or company admin profile fields. Requires `super_admin`.
      operationId: updateCompany
      security:
        - bearerAuth: []
      parameters:
        - name: tenantId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCompanyRequest'
            example:
              companyName: Acme Ltd
              adminEmail: admin@acme.com
              adminFirstName: Jane
              adminLastName: Admin
      responses:
        '200':
          description: Company updated
          content:
            application/json:
              schema:
                type: object
                required: [status, data]
                properties:
                  status:
                    type: string
                    enum: [ok]
                  data:
                    $ref: '#/components/schemas/RegistrationRequest'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Company not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Email already in use or company not approved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/admin/registrations/{tenantId}/deactivate:
    post:
      tags: [Admin]
      summary: Deactivate approved company
      description: Sets tenant and all users to inactive. Requires `super_admin`.
      operationId: deactivateCompany
      security:
        - bearerAuth: []
      parameters:
        - name: tenantId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Company deactivated
          content:
            application/json:
              schema:
                type: object
                required: [status, data]
                properties:
                  status:
                    type: string
                    enum: [ok]
                  data:
                    $ref: '#/components/schemas/RegistrationRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Company not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Company already inactive or not approved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/admin/registrations/{tenantId}/activate:
    post:
      tags: [Admin]
      summary: Reactivate approved company
      description: Sets tenant and all users to active. Requires `super_admin`.
      operationId: activateCompany
      security:
        - bearerAuth: []
      parameters:
        - name: tenantId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Company reactivated
          content:
            application/json:
              schema:
                type: object
                required: [status, data]
                properties:
                  status:
                    type: string
                    enum: [ok]
                  data:
                    $ref: '#/components/schemas/RegistrationRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Company not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Company already active or not approved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/employees:
    get:
      tags: [Employees]
      summary: List employees
      description: |
        Returns employees for the authenticated user's tenant.

        **Permissions:** `employee:read` (all employees) or `employee:read:team` (direct reports only).
      operationId: listEmployees
      security:
        - bearerAuth: []
      parameters:
        - name: search
          in: query
          schema:
            type: string
          description: Filter by name, email, job title, or employee number
        - name: department
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/EmployeeStatus'
        - name: sortBy
          in: query
          schema:
            type: string
            enum: [name, employeeNumber, jobTitle, department, manager]
          description: Sort field (default `name`; `name` and `manager` sort by first name, then last name)
        - name: sortOrder
          in: query
          schema:
            type: string
            enum: [asc, desc]
          description: Sort direction (default `asc`)
      responses:
        '200':
          description: Employee list
          content:
            application/json:
              schema:
                type: object
                required: [status, data]
                properties:
                  status:
                    type: string
                    enum: [ok]
                  data:
                    type: object
                    required: [employees]
                    properties:
                      employees:
                        type: array
                        items:
                          $ref: '#/components/schemas/Employee'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [Employees]
      summary: Create employee
      description: Requires `employee:create` permission.
      operationId: createEmployee
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateEmployeeRequest'
            example:
              firstName: Alex
              lastName: Morgan
              email: alex.morgan@acme.com
              jobTitle: Software Engineer
              department: Engineering
              startDate: '2024-03-01'
      responses:
        '201':
          description: Employee created
          content:
            application/json:
              schema:
                type: object
                required: [status, data]
                properties:
                  status:
                    type: string
                    enum: [ok]
                  data:
                    $ref: '#/components/schemas/Employee'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: Employee number or email already in use
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/employees/departments:
    get:
      tags: [Employees]
      summary: List departments
      description: Returns distinct department names used by employees in the tenant.
      operationId: listEmployeeDepartments
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Department list
          content:
            application/json:
              schema:
                type: object
                required: [status, data]
                properties:
                  status:
                    type: string
                    enum: [ok]
                  data:
                    type: object
                    required: [departments]
                    properties:
                      departments:
                        type: array
                        items:
                          type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/employees/{id}:
    get:
      tags: [Employees]
      summary: Get employee
      operationId: getEmployee
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Employee details
          content:
            application/json:
              schema:
                type: object
                required: [status, data]
                properties:
                  status:
                    type: string
                    enum: [ok]
                  data:
                    $ref: '#/components/schemas/Employee'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Employee not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    patch:
      tags: [Employees]
      summary: Update employee
      description: Partial update — only fields present in the body are applied. Requires `employee:update`.
      operationId: updateEmployee
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateEmployeeRequest'
            example:
              jobTitle: Senior Software Engineer
              status: active
      responses:
        '200':
          description: Employee updated
          content:
            application/json:
              schema:
                type: object
                required: [status, data]
                properties:
                  status:
                    type: string
                    enum: [ok]
                  data:
                    $ref: '#/components/schemas/Employee'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Employee not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Email already in use
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/employees/{id}/reports:
    get:
      tags: [Employees]
      summary: List direct reports
      operationId: listEmployeeReports
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Direct reports
          content:
            application/json:
              schema:
                type: object
                required: [status, data]
                properties:
                  status:
                    type: string
                    enum: [ok]
                  data:
                    type: object
                    required: [reports]
                    properties:
                      reports:
                        type: array
                        items:
                          $ref: '#/components/schemas/Employee'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Employee not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/leave/requests:
    get:
      tags: [Leave]
      summary: List leave requests
      description: |
        Returns leave requests scoped by role: own (employee), team (manager), or all (HR/admin).
      operationId: listLeaveRequests
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/LeaveRequestStatus'
        - name: employeeId
          in: query
          schema:
            type: string
        - name: from
          in: query
          schema:
            type: string
            format: date
        - name: to
          in: query
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Leave request list
          content:
            application/json:
              schema:
                type: object
                required: [status, data]
                properties:
                  status:
                    type: string
                    enum: [ok]
                  data:
                    type: object
                    required: [requests]
                    properties:
                      requests:
                        type: array
                        items:
                          $ref: '#/components/schemas/LeaveRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [Leave]
      summary: Submit leave request
      description: Requires `leave:create:own`. Resolves employee via userId or email fallback.
      operationId: createLeaveRequest
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateLeaveRequest'
            example:
              type: annual
              startDate: '2026-03-10'
              endDate: '2026-03-12'
              reason: Family holiday
      responses:
        '201':
          description: Leave request created
          content:
            application/json:
              schema:
                type: object
                required: [status, data]
                properties:
                  status:
                    type: string
                    enum: [ok]
                  data:
                    $ref: '#/components/schemas/LeaveRequest'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: Overlapping leave request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/leave/requests/{id}:
    get:
      tags: [Leave]
      summary: Get leave request
      operationId: getLeaveRequest
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
