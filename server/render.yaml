# Render background worker for BullMQ notification queue + scheduled jobs.
# Create a new Worker service in Render and point it at this file (root directory: server).
# Use the same env vars as the API except PORT is not required.

services:
  - type: worker
    name: hr-saas-notification-worker
    runtime: node
    plan: starter
    rootDir: server
    buildCommand: npm install
    startCommand: npm run worker
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: MONGODB_URI
        sync: false
      - key: REDIS_URL
        sync: false
      - key: ADMIN_JWT_SECRET
        sync: false
      - key: CLIENT_URL
        sync: false
      - key: SENDGRID_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: S3_ENDPOINT
        sync: false
      - key: S3_REGION
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: S3_FORCE_PATH_STYLE
        sync: false
